
services:
  vector-db:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      QDRANT_URL: http://vector-db:6333
      RANKENGINE_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8002:8000"
    depends_on:
      - vector-db
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    environment:
      RANKENGINE_API_URL: http://api:8000
    ports:
      - "8502:8501"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  qdrant_storage:
